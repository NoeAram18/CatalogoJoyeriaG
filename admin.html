<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gedalia ERP | Administración</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --black: #0a0a0a; --bg: #f4f7f6; }
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; background: var(--bg); }
        .sidebar { width: 280px; background: var(--black); height: 100vh; color: white; padding: 40px 20px; position: fixed; }
        .main { margin-left: 280px; padding: 40px; width: calc(100% - 280px); box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
        .btn-gold { background: var(--gold); color: white; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .section { display: none; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:var(--gold); letter-spacing:2px;">GEDALIA</h2>
    <div style="margin-top:40px;">
        <p onclick="showSection('inventory')" style="cursor:pointer; padding:10px 0;">💎 Inventario</p>
        <p onclick="prepareNew()" style="cursor:pointer; padding:10px 0;">✨ Nueva Pieza</p>
    </div>
</div>

<div class="main">
    <div id="inventory" class="section active">
        <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h3>Inventario de Plata</h3>
                <input type="text" id="admin-search" placeholder="Buscar pieza..." oninput="filtrarAdmin()" style="width:200px; margin:0;">
            </div>
            <table id="lista-prods">
                </table>
        </div>
    </div>

    <div id="form-section" class="section">
        <div class="card">
            <h3 id="form-title">Nueva Joya de Plata</h3>
            <input type="hidden" id="edit-id">
            
            <input type="text" id="codigo" placeholder="Código (ej. PLT-001)">
            <input type="text" id="nombre" placeholder="Nombre descriptivo">
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <input type="number" id="precio" placeholder="Precio USD">
                <input type="number" id="stock" placeholder="Cantidad en Stock">
            </div>

            <button id="btn-save" class="btn btn-gold" style="width:100%; margin-top:15px;" onclick="guardar()">GUARDAR JOYA EN AIVEN</button>
            <button class="btn" style="width:100%; margin-top:10px; background:#ddd;" onclick="showSection('inventory')">CANCELAR</button>
        </div>
    </div>
</div>

<script>
    let productos = [];

    // 1. Obtener productos de PostgreSQL
    async function cargar() {
        try {
            const res = await fetch('/api/productos');
            productos = await res.json();
            renderInventory(productos);
        } catch (error) {
            console.error("Error cargando inventario:", error);
        }
    }

    // 2. Mostrar la tabla
    function renderInventory(lista) {
        document.getElementById('lista-prods').innerHTML = `
            <thead><tr><th>Código</th><th>Pieza</th><th>Precio</th><th>Stock</th></tr></thead>
            <tbody>${lista.map(p => `
                <tr>
                    <td>${p.codigo}</td>
                    <td><b>${p.nombre}</b></td>
                    <td>$${p.precio}</td>
                    <td>${p.stock} pz</td>
                </tr>
            `).join('')}</tbody>
        `;
    }

    // 3. Cambiar de pantalla
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function prepareNew() {
        document.getElementById('edit-id').value = "";
        document.getElementById('form-title').innerText = "Nueva Joya de Plata";
        document.getElementById('codigo').value = "";
        document.getElementById('nombre').value = "";
        document.getElementById('precio').value = "";
        document.getElementById('stock').value = "";
        showSection('form-section');
    }

    // 4. Guardar en PostgreSQL (¡Sin falsos positivos!)
    async function guardar() {
        const btn = document.getElementById('btn-save');
        btn.disabled = true; 
        btn.innerText = "GUARDANDO...";

        const payload = {
            codigo: document.getElementById('codigo').value,
            nombre: document.getElementById('nombre').value,
            precio: parseFloat(document.getElementById('precio').value),
            stock: parseInt(document.getElementById('stock').value)
        };

        try {
            const respuesta = await fetch('/api/productos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (respuesta.ok) {
                alert("¡Éxito! La joya se guardó correctamente en tu base de datos.");
                cargar(); 
                showSection('inventory');
            } else {
                alert("Error: Verifica que el código no esté repetido.");
            }
        } catch (error) {
            console.error(error);
            alert("Error de comunicación con el servidor.");
        } finally {
            btn.disabled = false; 
            btn.innerText = "GUARDAR JOYA EN AIVEN";
        }
    }

    // 5. Buscador rápido
    function filtrarAdmin() {
        const q = document.getElementById('admin-search').value.toLowerCase();
        renderInventory(productos.filter(p => p.nombre.toLowerCase().includes(q) || p.codigo.toLowerCase().includes(q)));
    }

    // Iniciar
    cargar();
</script>
</body>
</html>
