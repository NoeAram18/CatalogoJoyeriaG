<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gedalia ERP | Administración de Joyería</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --black: #0a0a0a; --bg: #f4f7f6; --red-sale: #d9534f; }
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; background: var(--bg); }
        .sidebar { width: 280px; background: var(--black); height: 100vh; color: white; padding: 40px 20px; position: fixed; }
        .main { margin-left: 280px; padding: 40px; width: calc(100% - 280px); box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: middle; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s;}
        .btn-gold { background: var(--gold); color: white; }
        .btn-gold:disabled { background: #ccc; cursor: not-allowed; }
        .btn-edit { background: #4a90e2; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; margin-right: 5px; border:none; cursor:pointer;}
        .btn-danger { background: #ff4d4d; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; border:none; cursor:pointer;}
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .img-input-group { background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px dashed #ccc; margin-bottom: 15px; }
        .section { display: none; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
        .current-imgs-container { display: flex; gap: 8px; margin-bottom: 10px; }
        .current-img-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #ccc; }
        .badge-desc { background: var(--red-sale); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-left: 5px;}
        .badge-talla { background: #eee; color: #333; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-left: 5px; border: 1px solid #ddd;}
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:var(--gold); letter-spacing:2px;">GEDALIA ERP</h2>
    <div style="margin-top:40px;">
        <p onclick="showSection('inventory')" style="cursor:pointer; padding:10px 0;">💎 Mi Inventario</p>
        <p onclick="prepareNew()" style="cursor:pointer; padding:10px 0;">✨ Añadir Nueva Joya</p>
    </div>
</div>

<div class="main">
    <div id="inventory" class="section active">
        <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items: center;">
                <h3>Inventario de Plata</h3>
                <input type="text" id="admin-search" placeholder="Buscar por código o nombre..." oninput="filtrarAdmin()" style="width:250px; margin:0;">
            </div>
            <table id="lista-prods">
            </table>
        </div>
    </div>

    <div id="form-section" class="section">
        <div class="card">
            <h3 id="form-title">Añadir Nueva Joya al Catálogo</h3>
            
            <div style="display:grid; grid-template-columns:1fr 2fr; gap:10px;">
                <input type="text" id="codigo" placeholder="Código (ej. PLT-001)">
                <input type="text" id="nombre" placeholder="Nombre descriptivo de la pieza">
            </div>
            
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px;">
                <input type="number" id="precio" placeholder="Precio Base (MXN)" step="0.01">
                <input type="number" id="stock" placeholder="Stock">
                <input type="number" id="descuento" placeholder="Descuento % (Ej. 50)" min="0" max="100">
                <div style="display:flex; flex-direction:column;">
                <input type="text" id="talla" placeholder="Tallas (Ej. 6, 7, 8 o Unitalla)">
               <small style="font-size:11px; color:#666; margin-top:-8px; margin-bottom:10px;">Separa las tallas con comas.</small>
            </div>
            </div>

            <div id="preview-imagenes-actuales" style="display:none; margin-bottom:15px;">
                <p style="margin:0 0 5px 0; font-size:13px; color:#666;"><strong>Imágenes guardadas actualmente:</strong></p>
                <div id="galeria-preview" class="current-imgs-container"></div>
            </div>

            <div class="img-input-group">
                <p style="margin-top: 0; font-size: 14px; color: #555;">
                    <strong id="label-fotos-titulo">Fotografías de la Joya (Max 4):</strong><br>
                    <small id="label-fotos-sub">Si no seleccionas archivos nuevos en edición, se conservarán las fotos actuales.</small>
                </p>
                <input type="file" id="foto1" accept="image/*">
                <input type="file" id="foto2" accept="image/*">
                <input type="file" id="foto3" accept="image/*">
                <input type="file" id="foto4" accept="image/*">
            </div>

            <button id="btn-save" class="btn btn-gold" style="width:100%; padding: 15px;" onclick="guardarProducto()">GUARDAR JOYA EN CATÁLOGO</button>
            <button class="btn" style="width:100%; margin-top:10px; background:#ddd;" onclick="showSection('inventory')">CANCELAR</button>
        </div>
    </div>
</div>

<script>
    // --- CREDENCIALES DE CLOUDINARY ---
    const CLOUD_NAME = "oudq7dcf"; 
    const UPLOAD_PRESET = "gedalia_preset"; 

    let productos = [];
    let editandoId = null; 
    let imagenesExistentes = []; 

    // 1. Obtener productos de PostgreSQL
    async function cargar() {
        try {
            const res = await fetch('/api/productos');
            productos = await res.json();
            renderInventory(productos);
        } catch (error) {
            console.error("Error cargando inventario:", error);
        }
    }

    // 2. Mostrar la tabla
    function renderInventory(lista) {
        document.getElementById('lista-prods').innerHTML = `
            <thead><tr><th>Foto</th><th>Código</th><th>Pieza</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead>
            <tbody>${lista.map(p => {
                let tagsAdicionales = '';
                if(p.descuento && parseFloat(p.descuento) > 0) tagsAdicionales += `<span class="badge-desc">-${p.descuento}%</span>`;
                if(p.talla && p.talla.trim() !== '') tagsAdicionales += `<span class="badge-talla">T: ${p.talla}</span>`;

                return `
                <tr>
                    <td><img src="${(p.imagenes && p.imagenes.length > 0) ? p.imagenes[0] : 'https://via.placeholder.com/50'}" class="thumb"></td>
                    <td><b>${p.codigo}</b></td>
                    <td>${p.nombre} ${tagsAdicionales}</td>
                    <td>$${p.precio}</td>
                    <td>${p.stock} pz</td>
                    <td>
                        <button class="btn-edit" onclick="iniciarEdicion(${p.id})">Editar</button>
                        <button class="btn-danger" onclick="eliminarProducto(${p.id})">Borrar</button>
                    </td>
                </tr>
            `}).join('')}</tbody>
        `;
    }

    // 3. Cambiar de pantalla y limpiar
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function prepareNew() {
        editandoId = null;
        imagenesExistentes = [];
        document.getElementById('form-title').innerText = "Añadir Nueva Joya al Catálogo";
        document.getElementById('btn-save').innerText = "GUARDAR JOYA EN CATÁLOGO";
        document.getElementById('codigo').value = "";
        document.getElementById('nombre').value = "";
        document.getElementById('precio').value = "";
        document.getElementById('stock').value = "";
        document.getElementById('descuento').value = "";
        document.getElementById('talla').value = "";
        document.getElementById('foto1').value = "";
        document.getElementById('foto2').value = "";
        document.getElementById('foto3').value = "";
        document.getElementById('foto4').value = "";
        document.getElementById('preview-imagenes-actuales').style.display = "none";
        showSection('form-section');
    }

    // 4. Cargar datos en el formulario para editar
    function iniciarEdicion(id) {
        const prod = productos.find(p => p.id === id);
        if(!prod) return;

        editandoId = id;
        imagenesExistentes = prod.imagenes || [];

        document.getElementById('form-title').innerText = `Editar Joya: ${prod.codigo}`;
        document.getElementById('btn-save').innerText = "ACTUALIZAR DATOS DE LA JOYA";
        
        document.getElementById('codigo').value = prod.codigo;
        document.getElementById('nombre').value = prod.nombre;
        document.getElementById('precio').value = prod.precio;
        document.getElementById('stock').value = prod.stock;
        document.getElementById('descuento').value = prod.descuento || "";
        document.getElementById('talla').value = prod.talla || "";

        // Limpiar inputs de archivos
        document.getElementById('foto1').value = "";
        document.getElementById('foto2').value = "";
        document.getElementById('foto3').value = "";
        document.getElementById('foto4').value = "";

        // Mostrar vista previa
        const galeria = document.getElementById('galeria-preview');
        if(imagenesExistentes.length > 0) {
            galeria.innerHTML = imagenesExistentes.map(img => `<img src="${img}" class="current-img-preview">`).join('');
            document.getElementById('preview-imagenes-actuales').style.display = "block";
        } else {
            document.getElementById('preview-imagenes-actuales').style.display = "none";
        }

        showSection('form-section');
    }

    // 5. Subir imagen a Cloudinary
    async function subirImagenACloudinary(file) {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", UPLOAD_PRESET);

        try {
            const respuesta = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: "POST",
                body: formData
            });
            const datos = await respuesta.json();
            return datos.secure_url;
        } catch (error) {
            console.error("Error en Cloudinary:", error);
            return null;
        }
    }

    // 6. Guardar / Editar
    async function guardarProducto() {
        const btn = document.getElementById('btn-save');
        btn.disabled = true; 

        const codigo = document.getElementById('codigo').value.trim();
        const nombre = document.getElementById('nombre').value.trim();
        const precio = parseFloat(document.getElementById('precio').value);
        const stock = parseInt(document.getElementById('stock').value);
        const descuento = parseFloat(document.getElementById('descuento').value) || 0; // Por defecto 0
        const talla = document.getElementById('talla').value.trim(); // Texto libre o vacío

        if(!codigo || !nombre || isNaN(precio) || isNaN(stock)) {
            alert("Por favor llena todos los campos obligatorios correctamente (Código, Nombre, Precio y Stock).");
            btn.disabled = false;
            return;
        }

        const inputsFotos = [
            document.getElementById('foto1').files[0],
            document.getElementById('foto2').files[0],
            document.getElementById('foto3').files[0],
            document.getElementById('foto4').files[0]
        ];

        let urlsNuevas = [];
        let hayArchivosNuevos = inputsFotos.some(f => f !== undefined);

        if (hayArchivosNuevos) {
            btn.innerText = "⏳ SUBIENDO NUEVAS FOTOS A CLOUDINARY...";
            for (let archivo of inputsFotos) {
                if (archivo) {
                    const url = await subirImagenACloudinary(archivo);
                    if (url) urlsNuevas.push(url);
                }
            }
        }

        let imagenesFinales = (urlsNuevas.length > 0) ? urlsNuevas : imagenesExistentes;

        btn.innerText = "💾 GUARDANDO EN BASE DE DATOS...";

        // Payload actualizado con descuento y talla
        const payload = { codigo, nombre, precio, stock, descuento, talla, imagenes: imagenesFinales };

        try {
            let respuesta;
            
            if (editandoId) {
                respuesta = await fetch(`/api/productos/${editandoId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
            } else {
                respuesta = await fetch('/api/productos', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
            }

            if (respuesta.ok) {
                alert(editandoId ? "¡Joya actualizada con éxito!" : "¡Joya registrada con éxito!");
                cargar(); 
                showSection('inventory');
            } else {
                const err = await respuesta.json();
                alert("Error al guardar: " + (err.error || "Verifica los datos."));
            }
        } catch (error) {
            console.error(error);
            alert("Error de comunicación con el servidor.");
        } finally {
            btn.disabled = false; 
            btn.innerText = editandoId ? "ACTUALIZAR DATOS DE LA JOYA" : "GUARDAR JOYA EN CATÁLOGO";
        }
    }

    // 7. Eliminar producto
    async function eliminarProducto(id) {
        if (confirm("¿Estás seguro de que deseas eliminar esta joya de plata del inventario?")) {
            try {
                const res = await fetch(`/api/productos/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert("Pieza eliminada correctamente.");
                    cargar();
                } else {
                    alert("No se pudo eliminar de la base de datos.");
                }
            } catch (error) {
                console.error("Error al eliminar:", error);
                alert("Error de conexión al eliminar.");
            }
        }
    }

    // 8. Buscador rápido
    function filtrarAdmin() {
        const q = document.getElementById('admin-search').value.toLowerCase();
        renderInventory(productos.filter(p => p.nombre.toLowerCase().includes(q) || p.codigo.toLowerCase().includes(q)));
    }

    // Iniciar
    cargar();
</script>
</body>
</html>
