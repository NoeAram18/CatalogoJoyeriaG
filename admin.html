<script>
        let listaProductos = [];
        let tallaSeleccionadaModal = "";

        // --- CARGA DE DATOS AL INICIAR ---
        async function inicializarTienda() {
            try {
                // 1. Cargar Configuración de Campañas
                const resCampanas = await fetch('/api/campanas');
                const campanas = await resCampanas.json();
                aplicarCampanas(campanas);

                // 2. Cargar Catálogo de Joyas
                const resProductos = await fetch('/api/productos');
                listaProductos = await resProductos.json();
                renderizarProductos(listaProductos);
                renderizarTickerOfertas(listaProductos);
            } catch(err) {
                console.error("Error:", err);
                document.getElementById('contenedor-tienda').innerHTML = "<p style='color:red; text-align:center; grid-column: 1/-1;'>Ocurrió un error al cargar el catálogo.</p>";
            }
        }

        // --- INYECCIÓN DE CAMPAÑAS DINÁMICAS ---
        function aplicarCampanas(data) {
            // Lógica de Cortinilla (Splash Screen)
            const splash = document.getElementById('splash-screen');
            if (data.splashActivo) {
                document.getElementById('splash-img').src = data.splashImg || "https://via.placeholder.com/250x250/0a0a0a/c5a059?text=G+E+D+A+L+I+A";
                document.getElementById('splash-txt').innerText = data.splashTexto || "";
                
                // Desaparecer la cortinilla a los 2.5 segundos
                setTimeout(() => {
                    splash.classList.add('hidden');
                    setTimeout(() => splash.remove(), 800); 
                }, 2500);
            } else {
                splash.remove(); // Destruir cortinilla de inmediato si está apagada
            }

            // Inyección en Promo 1
            document.getElementById('p1-bg').src = data.promo1Img || "https://via.placeholder.com/800";
            document.getElementById('p1-badge').innerText = data.promo1Badge || "";
            document.getElementById('p1-title').innerText = data.promo1Titulo || "";
            document.getElementById('p1-sub').innerText = data.promo1Sub || "";
            document.getElementById('p1-badge').style.display = data.promo1Badge ? "inline-block" : "none";

            // Inyección en Promo 2
            document.getElementById('p2-bg').src = data.promo2Img || "https://via.placeholder.com/800";
            document.getElementById('p2-badge').innerText = data.promo2Badge || "";
            document.getElementById('p2-title').innerText = data.promo2Titulo || "";
            document.getElementById('p2-sub').innerText = data.promo2Sub || "";
            document.getElementById('p2-badge').style.display = data.promo2Badge ? "inline-block" : "none";
        }

        // --- LÓGICA DEL PANEL DE FILTROS ---
        function toggleSidebarFiltros() {
            document.getElementById('filter-sidebar').classList.toggle('active');
            document.getElementById('filter-overlay').classList.toggle('active');
        }

        function limpiarFiltros() {
            document.getElementById('buscador').value = "";
            document.getElementById('filtro-categoria').value = "";
            document.getElementById('filtro-piedra').value = "";
            document.getElementById('filtro-talla').value = "";
            document.getElementById('filtro-precio').value = "10000";
            document.getElementById('precio-val').innerText = "Sin límite";
            aplicarFiltrosInteligentes();
            toggleSidebarFiltros();
        }

        function aplicarFiltrosInteligentes() {
            const txtBusqueda = document.getElementById('buscador').value.toLowerCase().trim();
            const cat = document.getElementById('filtro-categoria').value.toLowerCase();
            const piedra = document.getElementById('filtro-piedra').value.toLowerCase();
            const tallaInput = document.getElementById('filtro-talla').value.toLowerCase().trim();
            const precioMax = parseFloat(document.getElementById('filtro-precio').value);

            const filtrados = listaProductos.filter(prod => {
                const nombre = (prod.nombre || "").toLowerCase();
                const codigo = (prod.codigo || "").toLowerCase();
                const tallaBD = (prod.talla || "").toLowerCase();
                
                const precioReal = prod.descuento ? prod.precio * (1 - (prod.descuento / 100)) : parseFloat(prod.precio);
                const matchBusqueda = nombre.includes(txtBusqueda) || codigo.includes(txtBusqueda);
                const matchCat = cat === "" || nombre.includes(cat);
                const matchPiedra = piedra === "" || nombre.includes(piedra);
                const matchTalla = tallaInput === "" || tallaBD.includes(tallaInput);
                const matchPrecio = precioMax >= 10000 ? true : precioReal <= precioMax;

                return matchBusqueda && matchCat && matchPiedra && matchTalla && matchPrecio;
            });

            renderizarProductos(filtrados);

            // Ocultar Banners y Promos si el usuario está usando los filtros para darle prioridad al catálogo
            const hayFiltros = txtBusqueda || cat || piedra || tallaInput || precioMax < 10000;
            document.getElementById('banner-nuevos').style.display = hayFiltros ? "none" : "flex";
            document.getElementById('seccion-promos').style.display = hayFiltros ? "none" : "block";
        }

        function renderizarProductos(productos) {
            const contenedor = document.getElementById('contenedor-tienda');
            if(productos.length === 0) {
                contenedor.innerHTML = "<p style='text-align:center; grid-column: 1/-1; color:#888; font-size:18px;'>No encontramos joyas con estos filtros. Intenta modificarlos.</p>";
                return;
            }

            contenedor.innerHTML = productos.map(prod => {
                const imgs = (prod.imagenes && prod.imagenes.length > 0) ? prod.imagenes : ['https://via.placeholder.com/400?text=Imagen+No+Disponible'];
                const imgPrincipal = imgs[0];
                let descuentoHTML = '';
                let precioHTML = `<p class="precio">$${parseFloat(prod.precio).toFixed(2)} MXN</p>`;
                
                if (prod.descuento && parseFloat(prod.descuento) > 0) {
                    const precioFinal = prod.precio - (prod.precio * (parseFloat(prod.descuento) / 100));
                    descuentoHTML = `<span class="badge-descuento">-${prod.descuento}%</span>`;
                    precioHTML = `
                        <div class="precio-container">
                            <span class="precio-original">$${parseFloat(prod.precio).toFixed(2)}</span>
                            <span class="precio">$${precioFinal.toFixed(2)} MXN</span>
                        </div>
                    `;
                }

                let carruselHTML = '';
                if(imgs.length > 1) {
                    carruselHTML = `
                        <div class="carousel">
                            ${imgs.map(img => `<img src="${img}" class="thumb">`).join('')}
                        </div>
                    `;
                }

                return `
                <div class="card" onclick="abrirModal(${prod.id})">
                    ${descuentoHTML}
                    <img src="${imgPrincipal}" class="main-img" alt="${prod.nombre}">
                    ${carruselHTML}
                    <div class="info">
                        <span class="codigo">${prod.codigo}</span>
                        <h3 class="nombre">${prod.nombre}</h3>
                        ${precioHTML}
                        <button class="btn-comprar" onclick="event.stopPropagation(); abrirModal(${prod.id});">Ver Detalles</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderizarTickerOfertas(productos) {
            const contenedorTicker = document.getElementById('contenedor-ticker');
            const tickerItems = document.getElementById('ticker-items');
            const ofertas = productos.filter(p => p.descuento && parseFloat(p.descuento) > 0);
            
            if (ofertas.length === 0) {
                contenedorTicker.style.display = 'none';
                return;
            }

            contenedorTicker.style.display = 'block';
            tickerItems.innerHTML = ofertas.map(prod => {
                const imgPrincipal = (prod.imagenes && prod.imagenes.length > 0) ? prod.imagenes[0] : 'https://via.placeholder.com/50';
                const precioFinal = prod.precio - (prod.precio * (parseFloat(prod.descuento) / 100));
                return `
                    <div class="ticker-item" onclick="abrirModal(${prod.id})">
                        <img src="${imgPrincipal}" alt="Oferta">
                        🔥 ¡OFERTA! ${prod.nombre} - ${prod.descuento}% OFF 
                        <span class="ticker-price">$${precioFinal.toFixed(2)} MXN</span>
                    </div>
                `;
            }).join('');
            
            tickerItems.innerHTML += tickerItems.innerHTML;
        }

        // --- FUNCIONES DEL MODAL INTERACTIVO ---
        window.abrirModal = function(id) {
            const prod = listaProductos.find(p => p.id === id);
            if(!prod) return;
            
            tallaSeleccionadaModal = ""; 

            const imgs = (prod.imagenes && prod.imagenes.length > 0) ? prod.imagenes : ['https://via.placeholder.com/400?text=Imagen+No+Disponible'];

            document.getElementById('modal-codigo').innerText = `Código: ${prod.codigo}`;
            document.getElementById('modal-nombre').innerText = prod.nombre;
            document.getElementById('modal-stock').innerText = `Disponibles en inventario: ${prod.stock} piezas`;

            const contenedorTalla = document.getElementById('modal-talla-container');
            if(prod.talla && prod.talla.trim() !== "") {
                const tallasArray = prod.talla.split(',').map(t => t.trim()).filter(t => t !== "");
                
                if (tallasArray.length > 0) {
                    let botonesHTML = tallasArray.map(t => `
                        <button class="talla-btn" onclick="seleccionarTalla(this, '${t}')">${t}</button>
                    `).join('');
                    
                    contenedorTalla.innerHTML = `
                        <p style="font-size: 13px; font-weight: 600; color: var(--black); margin-bottom: 8px;">Selecciona tu Talla:</p>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            ${botonesHTML}
                        </div>
                    `;
                }
            } else {
                contenedorTalla.innerHTML = '';
            }

            const contenedorPrecio = document.getElementById('modal-precio-container');
            if (prod.descuento && parseFloat(prod.descuento) > 0) {
                const precioFinal = prod.precio - (prod.precio * (parseFloat(prod.descuento) / 100));
                contenedorPrecio.innerHTML = `
                    <span class="precio-original">$${parseFloat(prod.precio).toFixed(2)}</span>
                    <span class="precio" style="color: var(--red-sale); font-size:32px;">$${precioFinal.toFixed(2)} MXN</span>
                `;
            } else {
                contenedorPrecio.innerHTML = `<span class="precio" style="font-size:32px;">$${parseFloat(prod.precio).toFixed(2)} MXN</span>`;
            }

            document.getElementById('modal-img-grande').src = imgs[0];
            const contenedorMinis = document.getElementById('modal-minis-container');
            if(imgs.length > 1) {
                contenedorMinis.innerHTML = imgs.map((img, index) => `
                    <img src="${img}" class="modal-thumb ${index === 0 ? 'active' : ''}" onclick="cambiarFotoModal('${img}', this)">
                `).join('');
                contenedorMinis.style.display = "flex";
            } else {
                contenedorMinis.style.display = "none";
            }

            document.getElementById('productModal').style.display = "flex";
        }

        window.seleccionarTalla = function(boton, talla) {
            const botones = document.querySelectorAll('.talla-btn');
            botones.forEach(b => b.classList.remove('selected'));
            boton.classList.add('selected');
            tallaSeleccionadaModal = talla;
        }

        window.cambiarFotoModal = function(url, thumbElement) {
            document.getElementById('modal-img-grande').src = url;
            const todas = thumbElement.parentElement.querySelectorAll('.modal-thumb');
            todas.forEach(t => t.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        window.cerrarModal = function() {
            document.getElementById('productModal').style.display = "none";
        }

        window.cerrarModalAfuera = function(event) {
            if (event.target === document.getElementById('productModal')) {
                cerrarModal();
            }
        }

        inicializarTienda();
    </script>
