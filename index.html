<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gedalia | Joyería de Plata Ley 925</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS GENERALES Y COLORES --- */
        :root { --gold: #c5a059; --black: #0a0a0a; --bg: #fdfdfd; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: #333; }
        
        header { background: var(--black); color: var(--gold); padding: 30px 20px; text-align: center; letter-spacing: 3px; }
        header h1 { margin: 0; font-size: 28px; font-weight: 600; }
        header p { color: white; font-size: 14px; margin: 5px 0 0 0; font-weight: 300; letter-spacing: 1px; }

        /* --- CUADRÍCULA DE PRODUCTOS --- */
        .catalogo-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px; }
        
        /* --- TARJETA DE PRODUCTO --- */
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        
        /* Imagen Principal */
        .main-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; margin-bottom: 12px; background: #f4f4f4; transition: opacity 0.3s; }
        
        /* --- CARRUSEL DE MINIATURAS (SCROLL HORIZONTAL) --- */
        .carousel { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding-bottom: 8px; 
            scroll-snap-type: x mandatory; 
            scrollbar-width: none; /* Oculta scrollbar en Firefox */
        }
        .carousel::-webkit-scrollbar { display: none; /* Oculta scrollbar en Chrome/Safari */ }
        
        .thumb { 
            width: 65px; 
            height: 65px; 
            object-fit: cover; 
            border-radius: 6px; 
            cursor: pointer; 
            border: 2px solid transparent; 
            scroll-snap-align: start; 
            flex-shrink: 0; 
            transition: 0.2s;
        }
        .thumb:hover { border-color: var(--gold); }
        .thumb.active { border-color: var(--gold); }

        /* --- INFO DEL PRODUCTO --- */
        .info { text-align: center; margin-top: 15px; }
        .codigo { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .nombre { margin: 8px 0; font-size: 18px; font-weight: 400; }
        .precio { color: var(--gold); font-weight: 600; font-size: 22px; margin: 10px 0; }
        
        .btn-comprar { 
            width: 100%; background: var(--black); color: white; padding: 14px; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: 600; 
            font-size: 14px; transition: 0.3s; letter-spacing: 1px; text-transform: uppercase;
        }
        .btn-comprar:hover { background: var(--gold); }
    </style>
</head>
<body>

    <header>
        <h1>GEDALIA</h1>
        <p>COLECCIÓN EXCLUSIVA DE PLATA 925</p>
    </header>

    <div class="catalogo-container">
        <div class="grid" id="contenedor-tienda">
            <p style="text-align:center; grid-column: 1/-1; color:#888;">Cargando catálogo de joyas...</p>
        </div>
    </div>

<script>
    // 1. Conectar con el servidor y pedir los productos
    async function cargarCatalogoFront() {
        try {
            const respuesta = await fetch('/api/productos');
            const productos = await respuesta.json();
            const contenedor = document.getElementById('contenedor-tienda');
            
            if(productos.length === 0) {
                contenedor.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>Catálogo en preparación. ¡Vuelve pronto!</p>";
                return;
            }

            // 2. Generar el HTML por cada producto
            contenedor.innerHTML = productos.map(prod => {
                // Verificamos si tiene imágenes, si no, ponemos una genérica
                const imgs = (prod.imagenes && prod.imagenes.length > 0) ? prod.imagenes : ['https://via.placeholder.com/400?text=Imagen+No+Disponible'];
                const imgPrincipal = imgs[0]; 
                
                // 3. Crear el carrusel de miniaturas solo si hay más de 1 foto
                let carruselHTML = '';
                if(imgs.length > 1) {
                    carruselHTML = `
                        <div class="carousel">
                            ${imgs.map(img => `
                                <img src="${img}" class="thumb" onclick="cambiarImagen(${prod.id}, '${img}', this)">
                            `).join('')}
                        </div>
                    `;
                }

                // 4. Devolver la tarjeta completa (¡Con el error matemático solucionado!)
                return `
                <div class="card">
                    <img src="${imgPrincipal}" id="main-img-${prod.id}" class="main-img" alt="${prod.nombre}">
                    
                    ${carruselHTML}
                    
                    <div class="info">
                        <span class="codigo">${prod.codigo}</span>
                        <h3 class="nombre">${prod.nombre}</h3>
                        <p class="precio">$${parseFloat(prod.precio).toFixed(2)}</p>
                        <button class="btn-comprar">Lo Quiero</button>
                    </div>
                </div>
                `;
            }).join('');
        } catch(err) {
            console.error("Error cargando la tienda:", err);
            document.getElementById('contenedor-tienda').innerHTML = "<p style='color:red; text-align:center; grid-column: 1/-1;'>Ocurrió un error al cargar el catálogo.</p>";
        }
    }

    // 5. Función que hace la magia del clic en el carrusel
    window.cambiarImagen = function(idProducto, nuevaUrl, elementoThumb) {
        document.getElementById(`main-img-${idProducto}`).src = nuevaUrl;
        
        const thumbnails = elementoThumb.parentElement.querySelectorAll('.thumb');
        thumbnails.forEach(t => t.classList.remove('active'));
        elementoThumb.classList.add('active');
    }

    // 6. Iniciar la carga al abrir la página
    cargarCatalogoFront();
</script>
</body>
</html>
